<!DOCTYPE html>
<html lang="en">
    <link rel="stylesheet" href="style.css">
    <body>
        <img src="./images/onedance.png" id="background">
        <audio src="music/onedance.mp3" id="song"></audio>
        <div class="container">
            <div class="box"></div>
            <div class="record">
                <img src="./images/onedance.png" id="thumbnail"/>
                <div class="centre"></div>
            </div>
            <img src="./icons/play.png" onclick="playPause()" id="playPause"/>
            <img src="./icons/fastforward.png" onclick="nextSong()" id="nextSong"/>
            <img src="./icons/backward.png" onclick="prevSong()" id="prevSong"/>

            <div class="artistName">Drake,Wizkid,Kyla</div>
            <div class="songName">One Dance</div>

            <input type="range" id="progress" min="0" max="" value="0" onchange="changeProgressBar()">

            <div class="currentTime"></div>
            <div class="durationTime"></div>

        </div>
        <script src="script.js"></script>
    </body>
</html>
